@if (recipe(); as item) {
  <div class="detail-card">
    <img [src]="item.image" [alt]="item.name" class="recipe-img">
    <h2>{{ item.id }} - {{ item.name }}</h2>
    <p><strong>Dificultad:</strong> {{ item.difficulty }}</p>
    <p><strong>Cocina:</strong> {{ item.cuisine }}</p>
  </div>
} @else {
  <p>No se encontró la receta.</p>
}
